# PaperPi5-AI configuration.
# Copy to config.toml (install.sh does this for you) and edit config.toml.
# Relative paths are resolved from the repository root.

[paths]
images_dir   = "images"
sd_binary    = "OnnxStream/src/build/sd"
model_dir    = "models/stable-diffusion-xl-turbo-1.0-anyshape-onnxstream"
prompts_file = "prompts/flowers.json"

[generate]
# Inky Impression 7.3" (Spectra 6) is 800x480. Width and height are swapped
# automatically when display.portrait = true.
width  = 800
height = 480
# SDXL Turbo looks good at 1-4 steps. More steps = slower.
steps  = 3
# Load the whole UNET into RAM (fast; fine with 8GB+). Set false if you hit
# out-of-memory errors.
ram_mode = true
# Only for a Pi with very little RAM (Pi Zero 2). Very slow.
low_mem  = false
# Any extra arguments to pass straight to OnnxStream's sd binary.
extra_sd_args = []

[storage]
# Old pictures are deleted automatically so the SD card never fills up.
# A picture is deleted if ANY rule applies. The newest one is always kept.
# Each picture is about 1 MB; at one an hour that's roughly 0.7 GB a month.
#
# Keep only the newest N pictures (0 = no limit).
keep_images = 0
# Delete pictures older than N days (0 = no limit).
keep_days = 30
# Safety net: if free space falls below this many GB, delete the oldest
# pictures until it's back above it (0 = off).
min_free_gb = 2

[llm]
# Let a small local language model write each prompt. If it fails for any
# reason, the plain prompt library (paths.prompts_file) is used instead.
enabled = true
# What every picture should be. Change this to change the frame's subject.
theme = "a sci-fi landscape on an alien planet"
# Random fragments from this library are given to the LLM as inspiration.
# With keep_style = true, the library's last list (art styles) is not shown to
# the LLM; one style is appended to its prompt unchanged.
inspiration_file = "prompts/planets.json"
keep_style = true
# Higher = more surprising ideas, lower = safer. 0.6-1.1 is a good range.
temperature = 0.9
# Maximum words in the LLM's scene description.
max_words = 35
# Show the LLM this many recent prompts and ask for something different.
recent_count = 8
threads = 4
# Give up and use the prompt library if the LLM takes longer than this.
timeout_seconds = 300
model = "models/llm/qwen2.5-3b-instruct-q4_k_m.gguf"
# Where install.sh downloads the model from.
model_url = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"

[display]
portrait   = false
# 0.0-1.0. Spectra 6 panels look best around 0.5.
saturation = 0.5
# Seconds to wait between generating and refreshing the panel. E-paper colours
# can suffer if the panel is refreshed while the Pi is still hot.
delay_seconds = 120
# Leave empty to auto-detect from the board's EEPROM. If detection fails, set
# to "spectra73" for the Inky Impression 7.3" (2025 / Spectra 6).
type = ""

[schedule]
# systemd OnCalendar expression for generating a new picture.
# Re-run scripts/install.sh (or scripts/install.sh --services) after changing.
on_calendar = "*-*-* 06:00:00"

[buttons]
# BCM GPIO numbers for buttons A-D on the Inky Impression 7.3".
# (Inky Impression 13.3" uses 25 for button C.)
pin_a = 5
pin_b = 6
pin_c = 16
pin_d = 24
# Hold button D this many seconds to shut down.
shutdown_hold_seconds = 3
